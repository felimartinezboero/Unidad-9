<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego de manos</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

<h1>Piedra, Papel o Tijera</h1>
<p class="info">Primero en llegar a 3</p>

<div class="score">
<div class="score-box">
<h3>Jugador</h3>
<p id="playerScore">0</p>
</div>

<div class="middle">:</div>

<div class="score-box">
<h3>Computadora</h3>
<p id="computerScore">0</p>
</div>
</div>

<div class="status">
<p id="result">Elegí una opción para jugar</p>
</div>

<div class="choices">

<button id="rock" aria-label="Piedra">
<svg viewBox="0 0 64 64" width="1em" height="1em" aria-hidden="true">
<path d="M9 42 17 20l15-9 19 8 7 19-9 14-24 2-13-7z" fill="#8b8b8b" stroke="#555" stroke-width="3" stroke-linejoin="round"/>
<path d="m18 23 14-8 15 6-7 8-17 1z" fill="#b5b5b5"/>
<path d="m16 39 10-7 13 3 6 13-19 2-11-6z" fill="#737373"/>
</svg>
</button>
<button id="paper">📄</button>
<button id="scissors">✂️</button>

</div>

<div class="details">
<p id="playerChoice">Jugador: -</p>
<p id="computerChoice">Computadora: -</p>
</div>

<button class="reset" id="resetGame">
Reiniciar juego
</button>

</div>

<script src="script.js"></script>

</body>
</html>
